{% extends 'calc/new/base.html' %}
{% block title %}승진점수 계산기{% endblock %}
{% block content %}
  <section class="hero welcome-main">
    <div class="hero-copy">
      <h1>초등교사 대상 승진점수 계산기</h1>
      <p>교감 자격연수와 승진에 필요한 점수를 기록하고 저장합니다.</p>
      <div class="hero-actions">
        <a class="button" href="{% url 'calc:register' %}">내 기록 시작하기</a>
        <a class="button secondary" href="{% url 'calc:guest_score_index' %}">점수 계산해보기</a>
      </div>
      <p class="fine-print">정확한 평정 결과가 아닌 참고용 예상점수입니다. 공식 제출 전에는 반드시 교육청 자료를 확인하세요.</p>
    </div>
    <div class="hero-panel" aria-hidden="true">
      <div class="mini-dashboard">
        <span class="eyebrow">나의 예상점수</span>
        <div class="sample-total">184.628</div>
        <div class="sample-bars">
          <span><i style="width: 88%"></i></span>
          <span><i style="width: 74%"></i></span>
          <span><i style="width: 92%"></i></span>
        </div>
        <div class="sample-list"><span>경력평정</span><strong>62.400</strong></div>
        <div class="sample-list"><span>연수성적</span><strong>25.800</strong></div>
        <div class="sample-list"><span>가산점</span><strong>8.428</strong></div>
      </div>
    </div>
  </section>
{% endblock %}
